# dsh-a2ui bundle patch —— 插入 a2ui 插件行。
#
# 注意：profile patch 是"整行替换"非深合并——这里只 insert 新行，
# 不改动 dsh base 的任何行。
#
# 两行作用：
#   - dsh-a2ui（@dsh-a2ui/a2ui-adapter）：宿主侧插件，注册 A2UI 教学段；
#   - dsh-a2ui-renderer（@dsh-a2ui/a2ui-renderer）：dsh.client 行，
#     ClientModuleRegistry 扫描到 `dsh.client.platform === 'web'` 后将其
#     编入 window.__DSH_BOOT__ 并下发 /plugins/@dsh-a2ui/a2ui-renderer/client.js。
- insert:
    - id: dsh-a2ui
      name: '@dsh-a2ui/a2ui-adapter'

    - id: dsh-a2ui-renderer
      name: '@dsh-a2ui/a2ui-renderer'
